<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Snake Game</title>
<style>
:root {
  --bg: #0f0f13;
  --canvas-bg: #1a1a24;
  --text: #e0e0e0;
  --green: #00ff66;
  --red: #ff3333;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  overflow: hidden;
}
#container {
  position: relative;
  background: #232330;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  font-size: 1.4rem;
  font-weight: 700;
}
#score {
  color: var(--green);
  text-shadow: 0 0 12px rgba(0,255,102,0.5);
}
canvas {
  background: var(--canvas-bg);
  border-radius: 8px;
  border: 2px solid #333344;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
  display: block;
}
#overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(15,15,19,0.88);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
#overlay.visible { opacity: 1; pointer-events: all; }
#overlay h2 { font-size: 2.5rem; color: var(--red); margin-bottom: 8px; text-shadow: 0 0 20px rgba(255,51,51,0.6); }
#overlay p { font-size: 1.2rem; margin-bottom: 24px; }
#overlay button {
  padding: 14px 36px;
  font-size: 1.1rem;
  font-weight: 700;
  color: #0f0f13;
  background: var(--green);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,255,102,0.4);
  transition: all 0.2s;
}
#overlay button:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,255,102,0.7); }
</style>
</head>
<body>

<div id="container">
  <div class="header">
    <span>🐍 Snake</span>
    <span>Score : <span id="score">0</span></span>
  </div>
  <canvas id="cv" width="400" height="400"></canvas>
  <div id="overlay">
    <h2>GAME OVER</h2>
    <p>Score final : <span id="finalScore">0</span></p>
    <button onclick="startGame()">🔄 Rejouer</button>
  </div>
</div>

<script>
const SIZE = 20;
const CANVAS = 400;
const CELL = CANVAS / SIZE;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score');
const finalScoreEl = document.getElementById('finalScore');
const overlay = document.getElementById('overlay');

let snake, dir, nextDir, food, score, loop, gameOver;

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  gameOver = false;
  scoreEl.textContent = '0';
  overlay.classList.remove('visible');
  spawnFood();
}

function spawnFood() {
  do {
    food = {x:Math.floor(Math.random()*SIZE),y:Math.floor(Math.random()*SIZE)};
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}

function draw() {
  ctx.clearRect(0,0,CANVAS,CANVAS);
  // Grille subtile
  ctx.strokeStyle='#222230';
  for(let i=0;i<SIZE;i++){
    ctx.beginPath();
    ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,CANVAS);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,i*CELL);ctx.lineTo(CANVAS,i*CELL);ctx.stroke();
  }
  // Serpent
  snake.forEach((s,i)=>{
    const grad=ctx.createRadialGradient(s.x*CELL+CELL/2,s.y*CELL+CELL/2,CELL/8,s.x*CELL+CELL/2,s.y*CELL+CELL/2,CELL/2);
    grad.addColorStop(0,i===0?'#5fff8a':'#00ff66');
    grad.addColorStop(1,i===0?'#00cc44':'#008833');
    ctx.fillStyle=grad;
    ctx.shadowColor='#00ff66';
    ctx.shadowBlur=i===0?10:5;
    ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
    ctx.shadowBlur=0;
  });
  // Pomme
  const grad2=ctx.createRadialGradient(food.x*CELL+CELL/3,food.y*CELL+CELL/3,CELL/10,food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2);
  grad2.addColorStop(0,'#ff6666');
  grad2.addColorStop(1,'#cc0000');
  ctx.fillStyle=grad2;
  ctx.shadowColor='#ff3333';
  ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
}

function move() {
  if(gameOver) return;
  dir = {...nextDir};
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  // Collision murs
  if(head.x<0||head.x>=SIZE||head.y<0||head.y>=SIZE) return endGame();
  // Collision soi-même
  if(snake.some(s=>s.x===head.x&&s.y===head.y)) return endGame();
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++;
    scoreEl.textContent=score;
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
}

function endGame() {
  gameOver=true;
  finalScoreEl.textContent=score;
  overlay.classList.add('visible');
  clearInterval(loop);
}

function startGame() {
  clearInterval(loop);
  init();
  draw();
  loop=setInterval(move,110);
}

document.addEventListener('keydown',e=>{
  if(gameOver) return;
  switch(e.key){
    case 'ArrowUp': if(dir.y!==1) nextDir={x:0,y:-1}; e.preventDefault(); break;
    case 'ArrowDown': if(dir.y!==-1) nextDir={x:0,y:1}; e.preventDefault(); break;
    case 'ArrowLeft': if(dir.x!==1) nextDir={x:-1,y:0}; e.preventDefault(); break;
    case 'ArrowRight': if(dir.x!==-1) nextDir={x:1,y:0}; e.preventDefault(); break;
  }
});

startGame();
</script>
</body>
</html>
