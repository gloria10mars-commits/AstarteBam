<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong - UI Expert</title>
    <style>
        :root {
            --neon-color: #00ffcc;
            --bg-color: #0d0f12;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border-radius: 8px;
        }

        canvas {
            display: block;
            background-color: #111418;
            border-radius: 8px;
            border: 2px solid rgba(0, 255, 204, 0.3);
        }

        #victoryScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 15, 18, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 10;
        }

        #victoryScreen.active {
            display: flex;
        }

        #winnerText {
            font-size: 3rem;
            color: var(--text-color);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color);
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            color: var(--bg-color);
            background-color: var(--neon-color);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
            background-color: #1affd6;
        }

        .controls {
            position: absolute;
            bottom: -40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="victoryScreen">
            <div id="winnerText">Joueur 1 Gagne !</div>
            <button onclick="resetGame()">Rejouer</button>
        </div>

        <div class="controls">
            <span>Joueur 1 : Z (Haut) / S (Bas)</span>
            <span>Joueur 2 : Flèches Haut / Bas</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const victoryScreen = document.getElementById('victoryScreen');
        const winnerText = document.getElementById('winnerText');

        const WINNING_SCORE = 11;
        const INITIAL_BALL_SPEED = 5;
        const PADDLE_SPEED = 8;
        const NEON_COLOR = '#00ffcc';

        let animationId;
        let isGameOver = false;

        const score = { p1: 0, p2: 0 };
        const paddle = { width: 10, height: 80 };
        
        const p1 = { x: 30, y: canvas.height / 2 - paddle.height / 2, dy: 0 };
        const p2 = { x: canvas.width - 30 - paddle.width, y: canvas.height / 2 - paddle.height / 2, dy: 0 };
        
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speed: INITIAL_BALL_SPEED,
            dx: INITIAL_BALL_SPEED,
            dy: INITIAL_BALL_SPEED
        };

        const keys = { z: false, s: false, ArrowUp: false, ArrowDown: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key.toLowerCase() === 'z') keys.z = true;
            if (key.toLowerCase() === 's') keys.s = true;
            if (key === 'ArrowUp') keys.ArrowUp = true;
            if (key === 'ArrowDown') keys.ArrowDown = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key.toLowerCase() === 'z') keys.z = false;
            if (key.toLowerCase() === 's') keys.s = false;
            if (key === 'ArrowUp') keys.ArrowUp = false;
            if (key === 'ArrowDown') keys.ArrowDown = false;
        });

        function drawRect(x, y, w, h, color) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            ctx.shadowBlur = 0;
        }

        function drawCircle(x, y, r, color) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawText(text, x, y, size) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = `bold ${size}px 'Segoe UI'`;
            ctx.textAlign = 'center';
            ctx.fillText(text, x, y);
        }

        function drawNet() {
            ctx.beginPath();
            ctx.setLineDash([15, 15]);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function update() {
            if (isGameOver) return;

            if (keys.z && p1.y > 0) p1.y -= PADDLE_SPEED;
            if (keys.s && p1.y < canvas.height - paddle.height) p1.y += PADDLE_SPEED;

            if (keys.ArrowUp && p2.y > 0) p2.y -= PADDLE_SPEED;
            if (keys.ArrowDown && p2.y < canvas.height - paddle.height) p2.y += PADDLE_SPEED;

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy *= -1;
            }

            if (ball.x - ball.radius < p1.x + paddle.width && ball.x + ball.radius > p1.x &&
                ball.y + ball.radius > p1.y && ball.y - ball.radius < p1.y + paddle.height) {
                
                let collidePoint = (ball.y - (p1.y + paddle.height / 2));
                collidePoint = collidePoint / (paddle.height / 2);
                let angleRad = (Math.PI / 4) * collidePoint;
                ball.dx = ball.speed * Math.cos(angleRad);
                ball.dy = ball.speed * Math.sin(angleRad);
                ball.speed += 0.5;
            } 
            else if (ball.x + ball.radius > p2.x && ball.x - ball.radius < p2.x + paddle.width &&
                     ball.y + ball.radius > p2.y && ball.y - ball.radius < p2.y + paddle.height) {
                
                let collidePoint = (ball.y - (p2.y + paddle.height / 2));
                collidePoint = collidePoint / (paddle.height / 2);
                let angleRad = (Math.PI / 4) * collidePoint;
                ball.dx = -1 * ball.speed * Math.cos(angleRad);
                ball.dy = ball.speed * Math.sin(angleRad);
                ball.speed += 0.5;
            }

            if (ball.x - ball.radius < 0) {
                score.p2++;
                checkWin();
                if(!isGameOver) serveBall(1);
            } else if (ball.x + ball.radius > canvas.width) {
                score.p1++;
                checkWin();
                if(!isGameOver) serveBall(-1);
            }
        }

        function serveBall(direction) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = INITIAL_BALL_SPEED;
            ball.dx = direction * INITIAL_BALL_SPEED;
            ball.dy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 3 + 2);
        }

        function checkWin() {
            if (score.p1 >= WINNING_SCORE) {
                endGame("Joueur 1 Gagne !");
            } else if (score.p2 >= WINNING_SCORE) {
                endGame("Joueur 2 Gagne !");
            }
        }

        function endGame(text) {
            isGameOver = true;
            winnerText.innerText = text;
            victoryScreen.classList.add('active');
        }

        function resetGame() {
            score.p1 = 0;
            score.p2 = 0;
            isGameOver = false;
            p1.y = canvas.height / 2 - paddle.height / 2;
            p2.y = canvas.height / 2 - paddle.height / 2;
            victoryScreen.classList.remove('active');
            serveBall(Math.random() > 0.5 ? 1 : -1);
        }

        function draw() {
            ctx.fillStyle = '#111418';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawNet();
            drawText(score.p1, canvas.width / 4, 100, 80);
            drawText(score.p2, 3 * canvas.width / 4, 100, 80);

            drawRect(p1.x, p1.y, paddle.width, paddle.height, NEON_COLOR);
            drawRect(p2.x, p2.y, paddle.width, paddle.height, NEON_COLOR);
            drawCircle(ball.x, ball.y, ball.radius, '#ffffff');
        }

        function loop() {
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }

        serveBall(1);
        loop();
    </script>
</body>
</html>
